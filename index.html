<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vamos PR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* OpenDyslexic (dyslexia-friendly). Falls back to Lexend, which is also designed for easy reading. */
  @font-face{
    font-family:"OpenDyslexic";
    src:url("https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic/files/opendyslexic-latin-400-normal.woff2") format("woff2");
    font-weight:400; font-display:swap;
  }
  @font-face{
    font-family:"OpenDyslexic";
    src:url("https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic/files/opendyslexic-latin-700-normal.woff2") format("woff2");
    font-weight:700; font-display:swap;
  }
  :root{
    --sand:#fff6e0; --card:#ffffff; --ink:#1d3b40; --muted:#5c7378; --line:#f0dfb8;
    --ocean:#0a8f9c; --deep:#066673; --coral:#ff6b4a; --hibiscus:#e83e8c; --sun:#ffc93c; --palm:#2fa66a;
    --radius:18px;
    --font:"OpenDyslexic","Lexend",system-ui,sans-serif;
  }
  body.clean{ --font:"Lexend",system-ui,sans-serif; }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:var(--font); font-size:16px; line-height:1.75; letter-spacing:.03em; word-spacing:.12em;
    color:var(--ink); background:var(--sand);
    background-image:radial-gradient(circle at 12% 8%, #ffe9a8 0, transparent 40%), radial-gradient(circle at 92% 30%, #ffd7c7 0, transparent 35%);
    background-attachment:fixed; text-align:left;
  }
  header{
    position:relative; color:#fff; padding:20px 16px 0;
    background:linear-gradient(160deg,#ff8a4a 0%, #ff6b4a 25%, #e83e8c 55%, #0a8f9c 100%);
    overflow:hidden;
  }
  header::before{ content:"☀️"; position:absolute; right:16px; top:8px; font-size:3rem; opacity:.9; }
  header::after{ content:"🌴  🌺  🥥  🌴"; position:absolute; left:16px; bottom:56px; font-size:1.1rem; opacity:.55; letter-spacing:.5em; }
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
  header h1{margin:0;font-size:1.7rem;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.15)}
  header .sub{opacity:.95;font-size:.95rem}
  .who{font-size:.78rem;text-align:right;position:relative;z-index:1;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:12px;margin-top:44px}
  .who button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
  nav{display:flex;gap:6px;overflow-x:auto;margin:16px -4px 0;padding:0 4px 14px;position:relative;z-index:1}
  nav button{flex:0 0 auto;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700}
  nav button.on{background:#fff;color:var(--deep);border-color:#fff}
  .wave{display:block;width:100%;height:28px;margin-top:-1px}
  main{max-width:840px;margin:0 auto;padding:12px 16px 40px}
  .card{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--ocean);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:0 3px 0 rgba(10,143,156,.08)}
  .card.plain{border-left-width:2px}
  .c-lodging{border-left-color:var(--ocean)} .c-transport{border-left-color:var(--sun)} .c-flights{border-left-color:var(--hibiscus)}
  .c-activities{border-left-color:var(--coral)} .c-places{border-left-color:var(--palm)} .c-food{border-left-color:#8e5bd6}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input,textarea,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fffdf7;color:var(--ink);font:inherit;font-size:.95rem}
  input:focus,textarea:focus,select:focus{outline:3px solid var(--sun);border-color:var(--ocean)}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 3px;font-weight:700}
  .btn{background:var(--coral);color:#fff;border:0;padding:10px 18px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #c9492c}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9492c}
  .btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--line);box-shadow:none}
  .btn.small{padding:4px 12px;font-size:.78rem}
  .item h3{margin:0 0 4px;font-size:1.05rem;line-height:1.5}
  .meta{color:var(--muted);font-size:.84rem;display:flex;gap:12px;flex-wrap:wrap;margin:4px 0}
  .tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.7rem;font-weight:700;background:var(--sun);color:#4a3500;vertical-align:middle}
  .tag.Booked,.tag.Done{background:var(--palm);color:#fff}
  .tag.Idea{background:#e9e2cf;color:var(--ink)}
  .tag.Planned{background:var(--hibiscus);color:#fff}
  .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}
  .chat{display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:340px}
  .msgs{flex:1;overflow-y:auto;padding:6px}
  .msg{max-width:82%;margin:8px 0;padding:8px 14px;border-radius:18px 18px 18px 4px;background:#fff;border:2px solid var(--line);word-wrap:break-word;white-space:pre-wrap}
  .msg.me{margin-left:auto;background:var(--ocean);color:#fff;border-color:var(--ocean);border-radius:18px 18px 4px 18px}
  .msg .n{font-size:.68rem;opacity:.8;font-weight:700}
  .msg .e{font-size:.68rem;margin-top:2px}
  .msg .e button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:0 6px 0 0;opacity:.85}
  .chatbar{display:flex;gap:8px;margin-top:8px}
  .overlay{max-width:460px;margin:8vh auto;padding:0 16px}
  .err{color:#c0301a;font-size:.9rem}
  .saved{color:var(--palm);font-size:.85rem;font-weight:700}
  a{color:var(--deep);font-weight:700}
  code{background:var(--line);padding:1px 6px;border-radius:6px;font-size:.85em}
  .fontbtn{position:fixed;right:12px;bottom:12px;z-index:9}
  .tile{flex:1 1 120px;text-align:center;cursor:pointer}
  .tile .big{font-size:1.8rem}
  .tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .tiles .tile{padding:10px 4px;margin:0;line-height:1.4}
  .tiles .tile .meta{font-size:.72rem;overflow-wrap:anywhere;margin:2px 0 0}
  @media (max-width:520px){ .tiles{gap:4px} .tiles .tile{padding:8px 2px;border-left-width:4px} .tiles .tile .big{font-size:1.3rem} .tiles .tile .meta{font-size:.58rem;letter-spacing:0;word-spacing:0} }
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .subtabs button{border:2px solid var(--line);background:#fff;color:var(--deep);padding:8px 14px;border-radius:99px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
  .subtabs button.on{background:var(--ocean);color:#fff;border-color:var(--ocean)}
  .tbl{overflow-x:auto;margin:8px 0}
  .tbl table{border-collapse:collapse;width:100%;font-size:.85rem}
  .tbl th{text-align:left;font-size:.72rem;color:var(--muted);padding:4px 6px;white-space:nowrap}
  .tbl td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
  .tbl input,.tbl select{width:auto;min-width:50px;padding:5px 8px;font-size:.85rem;border-radius:8px}
  .tbl .fit{display:block;width:max-content;min-width:100%}
  .tbl td,.tbl th{white-space:nowrap}
  .tbl .meta{display:inline;margin:0 0 0 8px}
  .tbl input,.tbl select{max-width:none}
  main.wide{max-width:min(1700px,100%)}
  .tbl tr.sel td{background:#e6f7f4}
  .tbl tr.tot td{font-weight:700;border-top:3px solid var(--ocean);font-size:1rem}
  .warn{color:#c0301a;font-weight:700;font-size:.75rem}
  .tbl tr.muted td{color:var(--muted);font-style:italic;background:#fbf4e2}
  .entry{border:2px dashed var(--line);border-radius:14px;padding:6px 12px 10px;margin:10px 0;background:#fffdf7}
  .entry-h{display:flex;justify-content:space-between;align-items:center;color:var(--deep)}
  .ok{color:var(--palm);font-weight:700;font-size:.82rem}
  .muted-note{color:var(--muted);font-size:.82rem;font-style:italic}
  .pn{margin-top:8px;border-top:2px dashed var(--line);padding-top:6px;white-space:normal;text-align:left}
  .pnote{background:#f4fbf9;border-left:4px solid var(--ocean);border-radius:8px;padding:4px 10px;margin:4px 0;font-size:.88rem;white-space:pre-wrap}
  .pnote b{color:var(--deep)}
  .pn summary{cursor:pointer;font-weight:700;color:var(--deep);font-size:.85rem;padding:2px 0}
  .pn textarea{min-height:70px;margin-top:6px}
  .pn-wrap{width:0;min-width:100%;white-space:normal}
  .tbl tr.pnrow td{border-top:0;padding-top:0}
</style>
</head>
<body>
<div id="app"></div>
<button class="btn ghost small fontbtn" id="fontbtn" title="Change the font">Aa</button>

<script type="module">
/* Firebase web config (safe to publish; it identifies the project, it is not a secret) */
const firebaseConfig = {
  apiKey: "AIzaSyATboR8tMjADmP0wa19g0Njs8PtJyUqRXo",
  authDomain: "vamospr-badf7.firebaseapp.com",
  projectId: "vamospr-badf7",
  storageBucket: "vamospr-badf7.firebasestorage.app",
  messagingSenderId: "876412272501",
  appId: "1:876412272501:web:186e132c79024ee9de9d3c"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
         query, orderBy, serverTimestamp, arrayUnion, arrayRemove, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}, del:k=>{try{localStorage.removeItem(k)}catch{}} };

/* Font toggle: OpenDyslexic (default) <-> Lexend */
function applyFont(){ document.body.classList.toggle("clean", ls.get("pr_font")==="clean"); }
applyFont();
document.getElementById("fontbtn").onclick = () => { ls.set("pr_font", ls.get("pr_font")==="clean" ? "dys" : "clean"); applyFont(); };

const CATS = {
  lodging:   { label:"Lodging",     icon:"🏡", titlePh:"e.g. Beach house in Rincón",      dateLabel:"Dates", statuses:["Idea","Considering","Booked"] },
  transport: { label:"Transport",   icon:"🚗", titlePh:"e.g. Rental car from SJU",        dateLabel:"Date",  statuses:["Idea","Considering","Booked"] },
  flights:   { label:"Flights",     icon:"✈️", titlePh:"e.g. CLE → SJU, Feb 9",           dateLabel:"Date",  statuses:["Idea","Considering","Booked"] },
  activities:{ label:"Activities",  icon:"🤿", titlePh:"e.g. Kayak the bioluminescent bay", dateLabel:"Date", statuses:["Idea","Planned","Booked","Done"] },
  places:    { label:"Must see",    icon:"🏝️", titlePh:"e.g. El Yunque",                  dateLabel:"When",  statuses:["Idea","Planned","Booked","Done"] },
  food:      { label:"Food/Drink",   icon:"🍹", titlePh:"e.g. Lechonera in Guavate",       dateLabel:"When",  statuses:["Idea","Planned","Booked","Done"] },
};
const TABS = ["chat","overview","budget",...Object.keys(CATS)];
const TAB_LABEL = { chat:"💬 Chat", overview:"🗺️ Overview", budget:"💰 Budget", ...Object.fromEntries(Object.entries(CATS).map(([k,v])=>[k,v.icon+" "+v.label])) };

let db, tripCode = ls.get("pr_trip"), me = ls.get("pr_name"), tab = ls.get("pr_tab") || "overview";
let unsubs = [], data = {}, messages = [], pn = [];
let overview = { text:"" };
let header = { title:"Vamos PR", subtitle:"Our island plans, shared · Feb 2027" };
let editing = null, editingHeader = false;

function boot(){
  db = getFirestore(initializeApp(firebaseConfig));
  if(!tripCode || !me){ return renderJoin(); }
  startListening();
  renderShell();
}

function renderJoin(err=""){
  $app.innerHTML = `<div class="overlay"><div class="card plain">
    <h2>¡Vamos a Puerto Rico! 🇵🇷🌴</h2>
    <p style="color:var(--muted)">Enter your name and your group's trip code.</p>
    <label>Your name</label><input id="jn" value="${esc(me||"")}" maxlength="30" placeholder="e.g. Damian">
    <label>Trip code</label><input id="jc" value="${esc(tripCode||"")}" maxlength="40" placeholder="e.g. pr-feb-2027-x7k2q9">
    <p class="err" id="je">${esc(err)}</p>
    <button class="btn" id="jb">Join the trip</button>
  </div></div>`;
  document.getElementById("jb").onclick = () => {
    const n = document.getElementById("jn").value.trim();
    const c = document.getElementById("jc").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
    if(!n) return renderJoin("Please enter your name.");
    if(c.length < 8) return renderJoin("Your trip code needs at least 8 characters (letters, numbers, - or _).");
    me = n; tripCode = c; ls.set("pr_name", n); ls.set("pr_trip", c);
    boot();
  };
}

const tripRef = (...p) => [db, "trips", tripCode, ...p];

function startListening(){
  unsubs.forEach(u=>u()); unsubs = []; data = {};
  for(const cat of Object.keys(CATS)){
    if(cat==="lodging") continue;          // lodging lives in budget_airbnb
    unsubs.push(onSnapshot(query(collection(...tripRef(cat)), orderBy("createdAt","asc")), snap => {
      data[cat] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if(tab===cat && !editing && !lForm) renderBody();
      if(tab==="overview" && !isTyping()) renderBody();
      if(tab==="budget") refreshBudget();
    }, showErr));
  }
  unsubs.push(onSnapshot(query(collection(...tripRef("messages")), orderBy("createdAt","asc")), snap => {
    messages = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(tab==="chat") renderChatMsgs(true);
  }, showErr));
  unsubs.push(onSnapshot(doc(...tripRef("meta","overview")), s => {
    overview = s.exists() ? s.data() : { text:"" };
    if(tab==="overview" && !isTyping()) renderBody();
  }, showErr));
  unsubs.push(onSnapshot(doc(...tripRef("meta","header")), s => {
    if(s.exists()) header = { ...header, ...s.data() };
    if(!editingHeader) renderHeaderText();
  }, showErr));
  unsubs.push(onSnapshot(collection(...tripRef("pnotes")), snap => {
    pn = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if(["chat","overview","budget"].includes(tab) || editing || lForm) return;
    if(isTyping()){ pendingRender = true; return; }
    renderBody();
  }, showErr));
  listenBudget();
}
const isTyping = () => document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

function showErr(e){
  console.error(e);
  const el = document.getElementById("body");
  if(el && !el.querySelector(".conn-err")) el.insertAdjacentHTML("afterbegin", `<div class="card conn-err err">Connection problem (${esc(e.code||e.message)}). Check your connection and Firestore rules.</div>`);
}

function renderShell(){
  $app.innerHTML = `
  <header>
    <div class="top">
      <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div>
        <button class="btn ghost small" id="hEdit" style="margin-top:6px">✏️ Edit title</button></div>
      <div class="who">${esc(me)}<br><button id="leave">switch</button></div>
    </div>
    <nav id="nav">${TABS.map(t=>`<button data-t="${t}" class="${t===tab?"on":""}">${TAB_LABEL[t]}</button>`).join("")}</nav>
  </header>
  <svg class="wave" viewBox="0 0 1200 28" preserveAspectRatio="none"><path d="M0 14 Q 75 0 150 14 T 300 14 T 450 14 T 600 14 T 750 14 T 900 14 T 1050 14 T 1200 14 V0 H0Z" fill="#0a8f9c"/></svg>
  <main id="body"></main>`;
  renderHeaderText();
  document.getElementById("hEdit").onclick = editHeader;
  document.getElementById("leave").onclick = () => { ls.del("pr_name"); ls.del("pr_trip"); me=null; tripCode=null; unsubs.forEach(u=>u()); renderJoin(); };
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { tab=b.dataset.t; ls.set("pr_tab",tab); editing=null;
    document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b)); renderBody(); });
  renderBody();
}

function renderHeaderText(){
  const t = document.getElementById("hTitle"), s = document.getElementById("hSub"); if(!t) return;
  t.textContent = header.title + " 🌴"; s.textContent = header.subtitle;
  document.getElementById("hEdit").style.display = "";
}
function editHeader(){
  editingHeader = true;
  document.getElementById("hTitle").innerHTML = `<input id="ht" value="${esc(header.title)}" maxlength="60">`;
  document.getElementById("hSub").innerHTML = `<input id="hs" value="${esc(header.subtitle)}" maxlength="100" style="margin-top:6px">`;
  const b = document.getElementById("hEdit"); b.textContent = "💾 Save title";
  b.onclick = async () => {
    const title = document.getElementById("ht").value.trim() || "Vamos PR";
    const subtitle = document.getElementById("hs").value.trim();
    try { await setDoc(doc(...tripRef("meta","header")), { title, subtitle, updatedBy:me, updatedAt:serverTimestamp() }); } catch(e){ showErr(e); }
    header = { title, subtitle }; editingHeader = false; b.textContent = "✏️ Edit title"; b.onclick = editHeader; renderHeaderText();
  };
}

function renderBody(){
  const body = document.getElementById("body"); if(!body) return;
  body.onchange = null; body.onclick = null;
  body.classList.toggle("wide", tab==="budget" || tab==="lodging");
  if(tab==="chat") return renderChat(body);
  if(tab==="overview") return renderOverview(body);
  if(tab==="budget") return renderBudget(body);
  if(tab==="lodging") return renderLodging(body);
  renderCategory(body, tab);
}

/* ---------- Chat (edit + delete your own messages) ---------- */
function renderChat(body){
  body.innerHTML = `<div class="chat"><div class="msgs" id="msgs"></div>
    <form class="chatbar" id="cf"><input id="ci" placeholder="Write to the group…" autocomplete="off" maxlength="1000"><button class="btn">Send</button></form></div>`;
  renderChatMsgs(true);
  document.getElementById("cf").onsubmit = async e => {
    e.preventDefault();
    const i = document.getElementById("ci"), t = i.value.trim(); if(!t) return;
    i.value = "";
    try { await addDoc(collection(...tripRef("messages")), { text:t, name:me, createdAt:serverTimestamp() }); } catch(err){ showErr(err); }
  };
}
function renderChatMsgs(scroll){
  const box = document.getElementById("msgs"); if(!box) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = messages.length ? messages.map(m => `<div class="msg ${m.name===me?"me":""}"><div class="n">${esc(m.name)}${fmtTime(m.createdAt)}${m.edited?" · edited":""}</div>${esc(m.text)}
      ${m.name===me?`<div class="e"><button data-me="${m.id}">edit</button><button data-md="${m.id}">delete</button></div>`:""}</div>`).join("")
    : `<div class="empty">The chat is quiet. Say hola. 👋</div>`;
  box.querySelectorAll("[data-me]").forEach(b => b.onclick = async () => {
    const m = messages.find(x=>x.id===b.dataset.me); const t = prompt("Edit your message", m.text); if(t===null || !t.trim()) return;
    try { await updateDoc(doc(...tripRef("messages",m.id)), { text:t.trim(), edited:true }); } catch(e){ showErr(e); }
  });
  box.querySelectorAll("[data-md]").forEach(b => b.onclick = async () => {
    if(confirm("Delete this message?")) try { await deleteDoc(doc(...tripRef("messages",b.dataset.md))); } catch(e){ showErr(e); }
  });
  if(scroll && (nearBottom || messages.length<2)) box.scrollTop = box.scrollHeight;
}
function fmtTime(ts){ if(!ts?.toDate) return ""; const d=ts.toDate(); return " · "+d.toLocaleDateString([], {month:"short",day:"numeric"})+" "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }

/* ---------- Overview ---------- */
const DEFAULT_OVERVIEW = `Who's going & when
• Catherine, Damian: Feb 9 – Feb 19
• Sara, Thomas, Amy, Jenna, Dave: Feb 12 – Feb 19

Notes, reminders, links…`;
function renderOverview(body){
  const tiles = Object.entries(CATS).map(([k,v])=>`<div class="card tile c-${k}" data-go="${k}"><div class="big">${v.icon}</div><b>${(k==="lodging" ? bAir : (data[k]||[])).length}</b><div class="meta" style="justify-content:center">${v.label}</div></div>`).join("");
  body.innerHTML = `${budgetSummaryCard()}<div class="tiles">${tiles}</div>
    <div class="card plain"><b>📝 Trip notes</b> <span class="meta">anyone can edit</span>
    <textarea id="ovText" style="min-height:240px">${esc(overview.text || DEFAULT_OVERVIEW)}</textarea>
    <div class="actions"><button class="btn" id="ovSave">💾 Save notes</button><span class="saved" id="ovMsg"></span></div></div>
    <div class="card plain"><button class="btn" id="xlBtn">📤 Export to Excel</button> <span class="saved" id="xlMsg"></span></div>`;
  document.getElementById("xlBtn").onclick = () => exportExcel(document.getElementById("xlBtn"), document.getElementById("xlMsg"));
  body.querySelectorAll("[data-go]").forEach(c => c.onclick = () => document.querySelector(`#nav [data-t="${c.dataset.go}"]`).click());
  document.getElementById("ovSave").onclick = async () => {
    try {
      await setDoc(doc(...tripRef("meta","overview")), { text:document.getElementById("ovText").value, updatedBy:me, updatedAt:serverTimestamp() });
      document.getElementById("ovMsg").textContent = "Saved ✔";
    } catch(err){ showErr(err); }
  };
}

/*NOTES_START*/
/* ---------- Personal notes: each person writes their own note under any entry; everyone sees all of them ---------- */
const openNotes = new Set();
const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "anon";
const pnKey = (cat,id) => cat+"__"+id;
const pnotesFor = (cat,id) => pn.filter(n => n.cat===cat && n.itemId===id).sort((a,b) => String(a.name).localeCompare(String(b.name)));
function pnHTML(cat,id){
  const list = pnotesFor(cat,id), mine = list.find(n => slug(n.name)===slug(me)), key = pnKey(cat,id);
  return `<div class="pn">${list.map(n => `<div class="pnote"><b>${esc(n.name)}:</b> ${esc(n.text)}</div>`).join("")}
    <details data-pk="${esc(key)}" ${openNotes.has(key)?"open":""}><summary>✍️ ${mine?"Edit my note":"Add my note"}</summary>
      <textarea maxlength="1000" placeholder="Only you can change your note">${esc(mine?.text||"")}</textarea>
      <div class="actions"><button class="btn small" data-pnsave data-cat="${esc(cat)}" data-id="${esc(id)}">💾 Save note</button>${mine?`<button class="btn ghost small" data-pndel data-cat="${esc(cat)}" data-id="${esc(id)}">🗑️ Remove</button>`:""}</div></details></div>`;
}
async function saveNote(cat,id,text){
  const ref = doc(...tripRef("pnotes", `${cat}__${id}__${slug(me)}`)); text = text.trim();
  if(!text) return deleteDoc(ref);
  return setDoc(ref, { cat, itemId:id, name:me, text, updatedAt:serverTimestamp() });
}
async function dropNotes(cat,id){
  const list = pnotesFor(cat,id); if(!list.length) return;
  const wb = writeBatch(db); list.forEach(n => wb.delete(doc(...tripRef("pnotes",n.id)))); await wb.commit();
}
document.addEventListener("toggle", e => { const d = e.target; if(d.matches && d.matches("details[data-pk]")) d.open ? openNotes.add(d.dataset.pk) : openNotes.delete(d.dataset.pk); }, true);
document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("[data-pnsave],[data-pndel]"); if(!b) return;
  const { cat, id } = b.dataset, box = b.closest(".pn"), t = box.querySelector("textarea");
  openNotes.delete(pnKey(cat,id));
  try{ await saveNote(cat, id, b.hasAttribute("data-pndel") ? "" : t.value); }catch(err){ showErr(err); }
  if(!isTyping()) renderBody();
});
/*NOTES_END*/

/* ---------- Categories ---------- */
function renderCategory(body, cat){
  const C = CATS[cat], items = data[cat] || [];
  body.innerHTML = `<div class="card plain"><button class="btn" id="addb">+ Add to ${C.label}</button></div><div id="form"></div>
    <div id="list">${items.length ? items.map(i => itemCard(cat,i)).join("") : `<div class="empty">Nothing here yet. 🌺</div>`}</div>`;
  document.getElementById("addb").onclick = () => openForm(cat);
  body.querySelectorAll("[data-act]").forEach(b => b.onclick = () => itemAction(cat, b.dataset.id, b.dataset.act));
}

function itemCard(cat,i){
  const votes = i.votes || [], voted = votes.includes(me);
  const link = i.link ? `<a href="${esc(/^https?:\/\//.test(i.link)?i.link:"https://"+i.link)}" target="_blank" rel="noopener">link ↗</a>` : "";
  return `<div class="card item c-${cat}">
    <h3>${esc(i.title)} <span class="tag ${esc(i.status)}">${esc(i.status||"Idea")}</span></h3>
    <div class="meta">${i.date?`<span>📅 ${esc(i.date)}</span>`:""}${costLine(cat,i)}${i.who?`<span>👥 ${esc(i.who)}</span>`:""}${link}</div>
    ${i.notes?`<div style="white-space:pre-wrap">${esc(i.notes)}</div>`:""}
    <div class="meta">added by ${esc(i.addedBy||"?")}${i.updatedBy&&i.updatedBy!==i.addedBy?` · edited by ${esc(i.updatedBy)}`:""}</div>
    ${pnHTML(cat,i.id)}
    <div class="actions">
      <button class="btn ghost small" data-act="vote" data-id="${i.id}">${voted?"👍 Voted":"👍 Vote"} ${votes.length||""}</button>
      <button class="btn ghost small" data-act="edit" data-id="${i.id}">✏️ Edit</button>
      <button class="btn ghost small" data-act="del" data-id="${i.id}">🗑️ Delete</button>
    </div></div>`;
}

async function itemAction(cat,id,act){
  const item = (data[cat]||[]).find(x=>x.id===id); if(!item) return;
  try{
    if(act==="vote") await updateDoc(doc(...tripRef(cat,id)), { votes: (item.votes||[]).includes(me) ? arrayRemove(me) : arrayUnion(me) });
    if(act==="del" && confirm(`Delete "${item.title}"?`)){ await deleteDoc(doc(...tripRef(cat,id))); await dropNotes(cat,id); }
    if(act==="edit") openForm(cat, item);
  }catch(e){ showErr(e); }
}

/*BATCH_START*/
/* ---------- Multi-entry add forms: Tab past the last field to start the next entry ---------- */
const bnv = v => v==="" ? null : Number(v);
const entryShell = (n,inner,removable) => `<div class="entry"><div class="entry-h"><b>Entry <span class="en">${n}</span></b>${removable?`<button type="button" class="btn ghost small" data-rm tabindex="-1">✕ remove</button>`:""}</div>${inner}</div>`;
const renumber = box => box.querySelectorAll(".entry").forEach((b,i) => b.querySelector(".en").textContent = i+1);
const gv = (b,k) => b.querySelector(`[data-k="${k}"]`).value.trim();
function appendBlock(box, html){
  box.insertAdjacentHTML("beforeend", html); renumber(box);
  const nb = box.lastElementChild; if(nb.scrollIntoView) nb.scrollIntoView({block:"nearest",behavior:"smooth"});
  nb.querySelector("input").focus();
}
function wireBatch(box, addBlock){
  box.addEventListener("keydown", e => {
    if(e.key!=="Tab" || e.shiftKey) return;
    const last = box.lastElementChild; if(!last || !last.contains(e.target)) return;
    const fields = [...last.querySelectorAll("input,select,textarea")];
    if(e.target!==fields[fields.length-1] || !fields[0].value.trim()) return;  // only auto-start when this entry has a title/name
    e.preventDefault(); addBlock();
  });
  box.addEventListener("click", e => {
    const r = e.target.closest("[data-rm]"); if(!r) return;
    r.closest(".entry").remove(); renumber(box);
  });
}
const ni = (k,label,w) => `<div style="flex:1 1 ${w}px"><label>${label}</label><input data-k="${k}" type="number" min="0" step="any"></div>`;
function lodgeBlock(n, region, removable){
  const regOpts = REGIONS.map(([r,l]) => `<option value="${r}" ${r===region?"selected":""}>${l}</option>`).join("");
  return entryShell(n, `<label>Listing name</label><input data-k="name" placeholder="e.g. Villa Carmen">
    <div class="row"><div style="flex:1 1 130px"><label>Area</label><select data-k="region">${regOpts}</select></div>
      <div style="flex:1 1 130px"><label>Status</label><select data-k="status"><option>Idea</option><option>Considering</option><option>Booked</option></select></div>
      ${ni("minDays","Min nights",90)}${ni("price","Price ($)",100)}
      <div style="flex:1 1 170px"><label>Price is</label><select data-k="priceType"><option value="night">per night</option><option value="stay">min-stay total</option></select></div></div>
    <div class="row">${ni("bedrooms","Bedrooms",80)}${ni("beds","Beds",80)}${ni("baths","Baths",80)}
      <div style="flex:1 1 90px"><label>Beach</label><select data-k="beach"><option value=""></option><option>Y</option><option>N</option></select></div>
      <div style="flex:1 1 110px"><label>Parking</label><input data-k="parking" placeholder="1 Space"></div>${ni("rating","Rating",80)}</div>
    <label>Link</label><input data-k="link" placeholder="https://…">
    <label>Notes</label><input data-k="notes" placeholder="optional">`, removable);
}
/*BATCH_END*/

function catBlock(cat, item, n, removable){
  const C = CATS[cat], ctype = item?.costType || CAT_COST_DEFAULT[cat] || "each";
  return entryShell(n, `<label>Title</label><input data-k="title" placeholder="${esc(C.titlePh)}" value="${esc(item?.title||"")}">
    <div class="row"><div style="flex:1 1 180px"><label>${C.dateLabel}</label><input data-k="date" value="${esc(item?.date||"")}" placeholder="Feb 12–19"></div>
      <div style="flex:1 1 120px"><label>Amount ($)</label><input data-k="amount" type="number" min="0" step="any" value="${esc(item?.amount??"")}" placeholder="0"></div>
      <div style="flex:1 1 200px"><label>Who pays?</label><select data-k="costType">${COST_TYPES.map(([v,t])=>`<option value="${v}" ${ctype===v?"selected":""}>${t}</option>`).join("")}</select></div>
      <div style="flex:1 1 140px"><label>Status</label><select data-k="status">${C.statuses.map(s=>`<option ${((item?.status)||C.statuses[0])===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
    <label>Cost note (optional)</label><input data-k="cost" value="${esc(item?.cost||"")}" placeholder="e.g. estimate before tax">
    <label>Link</label><input data-k="link" value="${esc(item?.link||"")}" placeholder="https://…">
    <label>Who's in?</label><input data-k="who" value="${esc(item?.who||"")}" placeholder="everyone, or names">
    <label>Notes</label><textarea data-k="notes">${esc(item?.notes||"")}</textarea>`, removable);
}

function openForm(cat, item=null){
  const C = CATS[cat]; editing = {cat, id:item?.id};
  const f = document.getElementById("form");
  f.innerHTML = `<div class="card c-${cat}"><b>${item?"Edit":"New"} · ${C.label}</b>
    <div class="meta">Only Booked items count toward the 💰 Budget.${item?"":" Tab past the last field to add another entry."}</div>
    <div id="entries">${catBlock(cat,item,1,false)}</div>
    <div class="actions"><button class="btn" id="f_save">💾 ${item?"Save":"Save all"}</button>${item?"":`<button class="btn ghost" id="f_more" type="button">+ Add another entry</button>`}<button class="btn ghost" id="f_cancel">Cancel</button></div></div>`;
  const box = document.getElementById("entries");
  f.scrollIntoView({behavior:"smooth"}); box.querySelector("input").focus();
  const close = () => { editing = null; renderBody(); };
  if(!item){ const more = () => appendBlock(box, catBlock(cat,null,box.children.length+1,true)); wireBatch(box, more); document.getElementById("f_more").onclick = more; }
  document.getElementById("f_cancel").onclick = close;
  document.getElementById("f_save").onclick = async () => {
    const rows = [...box.querySelectorAll(".entry")].filter(b => gv(b,"title")).map(b => ({ title:gv(b,"title"), date:gv(b,"date"), cost:gv(b,"cost"), amount:bnv(gv(b,"amount")), costType:gv(b,"costType"), status:gv(b,"status"), link:gv(b,"link"), who:gv(b,"who"), notes:b.querySelector('[data-k="notes"]').value.trim() }));
    if(!rows.length) return alert("Please add a title first.");
    try{
      if(item) await updateDoc(doc(...tripRef(cat,item.id)), { ...rows[0], updatedBy:me, updatedAt:serverTimestamp() });
      else { const wb = writeBatch(db); rows.forEach((r,i) => wb.set(doc(collection(...tripRef(cat))), { ...r, updatedBy:me, updatedAt:serverTimestamp(), addedBy:me, votes:[], createdAt:new Date(Date.now()+i) })); await wb.commit(); }
      close();
    }catch(e){ showErr(e); }
  };
}

function openLodgingForm(region="sj"){
  const f = document.getElementById("lform"); if(!f) return; lForm = true;
  f.innerHTML = `<div class="card c-lodging"><b>Add listings</b><div class="meta">Tab past the last field to add another listing.</div>
    <div id="lentries">${lodgeBlock(1,region,false)}</div>
    <div class="actions"><button class="btn" id="l_save">💾 Save all</button><button class="btn ghost" id="l_more" type="button">+ Add another listing</button><button class="btn ghost" id="l_cancel">Cancel</button></div></div>`;
  const box = document.getElementById("lentries");
  const more = () => appendBlock(box, lodgeBlock(box.children.length+1, box.lastElementChild.querySelector('[data-k="region"]').value, true));
  wireBatch(box, more);
  f.scrollIntoView({behavior:"smooth"}); box.querySelector("input").focus();
  const close = () => { lForm = false; renderBody(); };
  document.getElementById("l_more").onclick = more;
  document.getElementById("l_cancel").onclick = close;
  document.getElementById("l_save").onclick = async () => {
    const rows = [...box.querySelectorAll(".entry")].filter(b => gv(b,"name")).map(b => ({ region:gv(b,"region"), name:gv(b,"name"), minDays:bnv(gv(b,"minDays"))||1, price:bnv(gv(b,"price"))||0, priceType:gv(b,"priceType"), status:gv(b,"status"), votes:[], bedrooms:bnv(gv(b,"bedrooms")), beds:bnv(gv(b,"beds")), baths:bnv(gv(b,"baths")), beach:gv(b,"beach"), parking:gv(b,"parking"), rating:bnv(gv(b,"rating")), link:gv(b,"link"), notes:gv(b,"notes") }));
    if(!rows.length) return alert("Please name a listing first.");
    try{
      const wb = writeBatch(db);
      rows.forEach((r,i) => wb.set(doc(collection(...tripRef("budget_airbnb"))), { ...r, order:Date.now()+i, addedBy:me }));
      await wb.commit(); close();
    }catch(e){ showErr(e); }
  };
}

:4.97,"link":"https://www.airbnb.com/rooms/1189272092967452486?adults=8&children=0&infants=0&pets=0&wishlist_item_id=11006906826737&check_in=2027-02-12&check_out=2027-02-19&source_impression_id=p3_1790887798_P3KELRzVH2Q6GTK-&previous_page_section_name=1000","order":21,"status":"Idea","votes":[]}];
const ACT_SEED = [["Night Kayaking",70],["Beach Ride",100],["Zip Lining",100],["National Park",8]];
const VAN_SEED = [["Airport Access Fee",20,null,""],["CDW Deductible",21.95,null,""],["Energy Recovery Fee",1.85,null,""],["Facility Recovery Fee",2.6,null,""],["License Recovery Fee",2.5,null,""],["Insurance",12.95,null,"Optional"],["Additional Driver",12.95,null,"Optional"],["Car Seat",10.95,0,"Optional"],["GPS",12.95,0,"Optional"]];
const BUDGET_DEFAULT = { v:2, people:8, nightsSj:2, nightsEast:3, nightsWest:3, labelSj:"Fri-Sat", labelEast:"Sun-Tues", labelWest:"Wed-Fri",
  selSj:"sj-1", selEast:"e-1", selWest:"w-2", taxPct:10.36990898, vanWeek:1399.65, vanDay:199.95, vanStatus:"Idea" };
const REGIONS = [["sj","San Juan","Sj"],["e","Eastern","East"],["w","Western","West"]];
const COST_TYPES = [["split","Split among the group"],["each","Each person pays"],["one","One person only"]];
const CAT_COST_DEFAULT = { transport:"split", flights:"each", activities:"each", places:"each", food:"each" };
const EST_CATS = ["flights","transport","activities","places","food"];
let bset = { ...BUDGET_DEFAULT }, bAir = [], bVan = [];
let lForm = false;
let bTab = ls.get("pr_btab") === "van" ? "van" : "estimate", pendingRender = false, seeding = false;

/*CALC_START*/
const num = n => Number(n) || 0;
const money = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number.isFinite(n)?n:0);
const perNight = l => l ? (l.priceType==="stay" ? num(l.price)/Math.max(1,num(l.minDays)) : num(l.price)) : 0;
const sum = a => a.reduce((x,y)=>x+y,0);
function itemCost(cat,i,n){
  const amt = num(i.amount), type = i.costType || CAT_COST_DEFAULT[cat] || "each";
  const group = type==="each" ? amt*n : amt;
  return { type, amt, group, pp: group/n };
}
function vanCalc(days){
  const S = bset, people = Math.max(1,num(S.people));
  const week = days>=7 ? num(S.vanWeek) : 0;
  const extra = days>=7 ? days-7 : days;
  const dayCost = num(S.vanDay)*extra;
  const lines = bVan.map(l => { const qtyUsed = (l.qty===null||l.qty===undefined||l.qty==="") ? days : num(l.qty); return { ...l, qtyUsed, amt:num(l.rate)*qtyUsed }; });
  const subtotal = week + dayCost + sum(lines.map(l=>l.amt));
  const tax = subtotal*num(S.taxPct)/100;
  const total = subtotal + tax;
  return { week, extra, dayCost, lines, subtotal, tax, total, pp: total/people };
}
function calcEstimate(){
  const S = bset, n = Math.max(1,num(S.people));
  const nights = num(S.nightsSj)+num(S.nightsEast)+num(S.nightsWest);
  const van = vanCalc(nights);
  const vanCounted = S.vanStatus==="Booked";
  const lodging = [["sj","San Juan","Sj"],["e","Eastern","East"],["w","Western","West"]].map(([reg,label,k]) => {
    const nt = num(S["nights"+k]);
    const booked = bAir.filter(x => x.region===reg && x.status==="Booked").map(x => ({ listing:x, total:perNight(x)*nt }));
    const preview = bAir.find(x => x.id===S["sel"+k] && x.region===reg);
    const bookedTotal = sum(booked.map(b=>b.total));
    return { k, reg, label, nights:nt, booked, bookedTotal, preview, previewTotal:perNight(preview)*nt };
  });
  const cats = EST_CATS.map(cat => {
    const items = (data[cat]||[]).map(i => ({ i, ...itemCost(cat,i,n) }));
    const booked = items.filter(x => x.i.status==="Booked"), other = items.filter(x => x.i.status!=="Booked");
    return { cat, booked, other, bookedTotal:sum(booked.map(x=>x.group)), potential:sum(other.map(x=>x.group)) };
  });
  const total = sum(lodging.map(l=>l.bookedTotal)) + (vanCounted ? van.total : 0) + sum(cats.map(c=>c.bookedTotal));
  return { n, nights, van, vanCounted, lodging, cats, total, pp: total/n };
}
/*CALC_END*/

function listenBudget(){
  unsubs.push(onSnapshot(doc(...tripRef("meta","budget")), s => {
    if(s.exists()){ bset = { ...BUDGET_DEFAULT, ...s.data() }; if(!s.data().v) migrateBudget(s.data()); }
    else if(!s.metadata.fromCache) seedBudget();
    refreshBudget();
  }, showErr));
  const watch = (col,set) => unsubs.push(onSnapshot(query(collection(...tripRef(col)), orderBy("order","asc")), snap => {
    set(snap.docs.map(d => ({ id:d.id, ...d.data() }))); refreshBudget();
  }, showErr));
  watch("budget_airbnb", v => bAir = v); watch("budget_van", v => bVan = v);
}
function refreshBudget(){
  if(tab!=="budget" && tab!=="overview" && tab!=="lodging") return;
  if(tab==="lodging" && lForm) return;
  if(isTyping()){ pendingRender = true; return; }
  renderBody();
}
document.addEventListener("focusout", () => setTimeout(() => { if(pendingRender && !isTyping() && !editing && !(tab==="lodging" && lForm)){ pendingRender = false; renderBody(); } }, 0));

/* Spreadsheet activities/flights become normal items on the Activities and Flights tabs */
function seedItemWrites(b, flight){
  ACT_SEED.forEach(([title,amount],i) => b.set(doc(...tripRef("activities","seed-act-"+(i+1))), { title, date:"", cost:"", amount, costType:"each", status:"Planned", link:"", who:"", notes:"From the spreadsheet", addedBy:"spreadsheet", votes:[], createdAt:serverTimestamp() }));
  b.set(doc(...tripRef("flights","seed-flt-1")), { title:"Flights (from spreadsheet)", date:"", cost:"", amount:flight.amount, costType:flight.costType, status:"Idea", link:"", who:"", notes:"The spreadsheet was unclear here. Confirm the amount and Who pays?", addedBy:"spreadsheet", votes:[], createdAt:serverTimestamp() });
}
async function seedBudget(){
  if(seeding) return; seeding = true;
  try{
    const b = writeBatch(db);
    AIRBNB_SEED.forEach(r => { const { id, ...rest } = r; b.set(doc(...tripRef("budget_airbnb",id)), { ...rest, createdAt:serverTimestamp() }); });
    VAN_SEED.forEach(([name,rate,qty,note],i) => b.set(doc(...tripRef("budget_van","v"+(i+1))), { name, rate, qty, note, order:i+1 }));
    seedItemWrites(b, { amount:882, costType:"each" });
    b.set(doc(...tripRef("meta","budget")), { ...BUDGET_DEFAULT, updatedBy:me, updatedAt:serverTimestamp() });
    await b.commit();
  }catch(e){ seeding = false; showErr(e); }
}
/* For a trip that already imported the first version of the spreadsheet */
async function migrateBudget(old){
  if(seeding) return; seeding = true;
  try{
    const b = writeBatch(db);
    seedItemWrites(b, { amount:num(old.flights)||882, costType: old.flightsMode==="total" ? "split" : "each" });
    b.set(doc(...tripRef("meta","budget")), { v:2, vanStatus:"Idea", flights:deleteField(), flightsMode:deleteField(), updatedBy:me, updatedAt:serverTimestamp() }, { merge:true });
    await b.commit();
  }catch(e){ seeding = false; showErr(e); }
}

const setNum = (k,w=80) => `<input type="number" min="0" step="any" data-set="${k}" data-type="num" value="${esc(bset[k]??"")}" style="width:${w}px">`;
const setTxt = (k,w=110) => `<input data-set="${k}" value="${esc(bset[k]??"")}" maxlength="30" style="width:${w}px">`;
const statusSel = (key,val,opts) => `<select data-set="${key}">${opts.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`;
const typeLabel = t => (COST_TYPES.find(x=>x[0]===t)||[])[1] || "";

function costLine(cat,i){
  const n = Math.max(1,num(bset.people)), amt = num(i.amount);
  const note = i.cost ? `<span>📝 ${esc(i.cost)}</span>` : "";
  if(!amt) return note;
  const c = itemCost(cat,i,n);
  const txt = c.type==="split" ? `${money(amt)} split ${n} ways (${money(amt/n)} each)`
            : c.type==="one" ? `${money(amt)} · one person${i.who?` (${esc(i.who)})`:""}`
            : `${money(amt)} each × ${n} = ${money(amt*n)}`;
  return `<span>💵 ${txt}</span><span class="${i.status==="Booked"?"ok":"muted-note"}">${i.status==="Booked"?"✔ counted":"not counted until Booked"}</span>${note}`;
}

function estimateHTML(){
  const E = calcEstimate(), S = bset, n = E.n;

    <div class="row" style="align-items:center;margin:6px 0"><span style="min-width:130px">People</span>${setNum("people",70)}</div>

    <div class="meta">Total nights: <b>${E.nights}</b></div></div>`;
  const R = (cells,cls="") => `<tr class="${cls}">${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`;
  const lodgingRows = E.lodging.map(L => {
    const sub = `${L.nights} nights${S["label"+L.k]?` · ${esc(S["label"+L.k])}`:""}`;
    if(L.booked.length) return L.booked.map(b => R([`🏡 ${L.label}: ${esc(b.listing.name)}<div class="meta">${sub}</div>`,"Split among the group",money(b.total),money(b.total/n)])).join("");
    const opts = bAir.filter(x => x.region===L.reg).map(x => `<option value="${esc(x.id)}" ${x.id===S["sel"+L.k]?"selected":""}>${esc(x.name)} — ${money(perNight(x))}/night</option>`).join("");
    return R([`🏡 ${L.label}: nothing booked yet<div class="meta">${sub}</div>`,`preview: <select data-set="sel${L.k}"><option value="">— choose —</option>${opts}</select>`,`${money(L.previewTotal)} <span class="warn">not counted</span>`,money(L.previewTotal/n)],"muted");
  }).join("");
  const vanRow = R([`🚐 Passenger van<div class="meta">${E.nights} days</div>`,`${statusSel("vanStatus",S.vanStatus,["Idea","Considering","Booked"])} <button class="btn ghost small" data-do="goto" data-to="van">details</button>`,`${money(E.van.total)}${E.vanCounted?"":` <span class="warn">not counted</span>`}`,money(E.van.pp)], E.vanCounted?"":"muted");
  const catRows = E.cats.map(c => {
    const C = CATS[c.cat];

    return rows + rest;
  }).join("");
  return `${basics}<div class="card plain"><b>🧮 Cost estimate</b> <span class="meta">Booked items only</span>
    <div class="tbl"><table><thead><tr><th>Item</th><th>How it's paid</th><th>Group cost</th><th>Avg per person</th></tr></thead><tbody>

function lodgingHTML(){

      const sl = (field,opts,cur) => `<select data-col="budget_airbnb" data-id="${esc(x.id)}" data-field="${field}">${opts.map(([v,t]) => `<option value="${v}" ${cur===v?"selected":""}>${t}</option>`).join("")}</select>`;

        <td>${f("bedrooms","num",55)}</td><td>${f("beds","num",55)}</td><td>${f("baths","num",55)}</td>
        <td>${sl("beach",[["",""],["Y","Y"],["N","N"]],x.beach||"")}</td>
        <td>${f("parking","text",90)}</td><td>${f("rating","num",65)}</td>
        <td><button class="btn ghost small" data-do="vote" data-id="${esc(x.id)}">👍 ${votes.length||""}${voted?" ✓":""}</button></td>

      <div class="actions"><button class="btn small" data-do="addAir" data-reg="${reg}">+ Add ${label} listing</button></div></div>`;

async function onBudgetChange(e){
  const d = e.target.dataset; if(!d.set && !d.col) return;
  let v = e.target.value; if(d.type==="num") v = v==="" ? null : Number(v);
  try{
    if(d.set) await setDoc(doc(...tripRef("meta","budget")), { [d.set]:v, updatedBy:me, updatedAt:serverTimestamp() }, { merge:true });
    else await updateDoc(doc(...tripRef(d.col,d.id)), { [d.field]:v, updatedBy:me, updatedAt:serverTimestamp() });
  }catch(err){ showErr(err); }
}
async function onBudgetClick(e){
  const b = e.target.closest("[data-do]"); if(!b) return; const d = b.dataset;
  try{
    if(d.do==="goto"){ bTab = d.to; ls.set("pr_btab",bTab); return renderBody(); }
    if(d.do==="gotoTab") return document.querySelector(`#nav [data-t="${d.to}"]`).click();
    if(d.do==="vote"){ const x = bAir.find(z => z.id===d.id); if(x) await updateDoc(doc(...tripRef("budget_airbnb",d.id)), { votes:(x.votes||[]).includes(me) ? arrayRemove(me) : arrayUnion(me) }); }

/* ---------- Excel export: one workbook, one sheet per section, totals as live formulas ---------- */

  const shade = (ws,row,argb) => ws.getRow(row).eachCell({includeEmpty:true}, c => { c.fill = { type:"pattern", pattern:"solid", fgColor:{argb} }; });
  const widths = (ws,w) => w.forEach((x,i) => ws.getColumn(i+1).width = x);
  const fmt = (ws,cols,f) => cols.forEach(c => ws.getColumn(c).numFmt = f);

      { formula:`${qs("Estimate")}!$B$${5+idx}`, result:nt },
      { formula:`G${r}*H${r}`, result:stay },
      { formula:`I${r}/${PEOPLE}`, result:stay/n },
      blank(x.bedrooms), blank(x.beds), blank(x.baths), x.beach||"", x.parking||"", blank(x.rating), (x.votes||[]).length, link(x.link), x.notes||"", gnotes("lodging",x.id)]);
    lodRow[x.id] = r; if(x.status==="Booked") shade(L,r,"FFE6F7F4");
  }));
  widths(L,[11,36,12,10,10,15,11,8,12,12,10,7,7,8,11,8,7,30,34,44]); fmt(L,[5,7,9,10],MONEY);
  L.getColumn(19).alignment = L.getColumn(20).alignment = { wrapText:true, vertical:"top" };
  L.views = [{ state:"frozen", xSplit:2, ySplit:1 }]; L.autoFilter = { from:"A1", to:"T1" };

  /* Van rental */
  const V = E.van, Vs = W["Van rental"];

  Vs.addRow(["Days", { formula:`${qs("Estimate")}!$B$8`, result:nights }]);
  Vs.addRow([]); Vs.addRow(["Line","Rate","Qty","Note","Amount"]); hdr(Vs,5);
  Vs.addRow(["1 week", num(bset.vanWeek), { formula:"IF($B$3>=7,1,0)", result:nights>=7?1:0 }, "", { formula:"B6*C6", result:V.week }]);
  Vs.addRow(["Per day", num(bset.vanDay), { formula:"IF($B$3>=7,$B$3-7,$B$3)", result:V.extra }, nights>=7?"days beyond 7":"all days", { formula:"B7*C7", result:V.dayCost }]);
  V.lines.forEach(l => { const r = Vs.rowCount+1, auto = (l.qty===null||l.qty===undefined||l.qty==="");
    Vs.addRow([l.name, num(l.rate), auto ? { formula:"$B$3", result:nights } : num(l.qty), l.note||"", { formula:`B${r}*C${r}`, result:l.amt }]); });
  const vLast = Vs.rowCount, vSub = vLast+1, vTax = vLast+2, vTot = vLast+3;
  Vs.addRow(["Subtotal","","","",{ formula:`SUM(E6:E${vLast})`, result:V.subtotal }]);
  Vs.addRow(["Taxes (%)", num(bset.taxPct), "", "", { formula:`E${vSub}*B${vTax}/100`, result:V.tax }]);
  Vs.addRow(["Total","","","",{ formula:`E${vSub}+E${vTax}`, result:V.total }]);
  Vs.addRow(["Per person","","","",{ formula:`E${vTot}/${PEOPLE}`, result:V.pp }]);
  [vSub,vTax,vTot,vTot+1].forEach(r => Vs.getRow(r).font = { bold:true }); sect(Vs,vTot);
  widths(Vs,[28,12,8,22,14]); fmt(Vs,[2,5],MONEY); Vs.getCell(`B${vTax}`).numFmt = "0.00"; Vs.getCell("B3").numFmt = "0";
  Vs.getColumn(3).numFmt = "0.##";

  /* Flights, Transport, Activities, Must see, Food/Drink */
  const catRow = {};
  Object.keys(SHEET).forEach(cat => {
    const ws = W[SHEET[cat]]; catRow[cat] = {}; const items = data[cat] || [];
    ws.addRow(["Title","Date","Status","Amount","Who pays","Group cost","Per person","Counted","Who's in","Cost note","Votes","Link","Notes","Everyone's notes","Added by"]); hdr(ws,1);
    items.forEach(i => { const r = ws.rowCount+1, c = itemCost(cat,i,n);

        { formula:`IF(C${r}="Booked","Yes","No")`, result:i.status==="Booked"?"Yes":"No" },
        i.who||"", i.cost||"", (i.votes||[]).length, link(i.link), i.notes||"", gnotes(cat,i.id), i.addedBy||""]);

      ws.getRow(last+2).font = { bold:true }; sect(ws,last+2); }
    widths(ws,[34,16,12,11,20,13,13,9,18,22,7,30,40,44,14]); fmt(ws,[4,6,7],MONEY);
    ws.getColumn(13).alignment = ws.getColumn(14).alignment = { wrapText:true, vertical:"top" };
    ws.views = [{ state:"frozen", xSplit:1, ySplit:1 }]; ws.autoFilter = { from:"A1", to:"O1" };
  });

  /* Estimate */
  const Es = W["Estimate"];
  Es.addRow([header.title||"Vamos PR"]); Es.getRow(1).font = { bold:true, size:16, color:{argb:"FF066673"} };
  Es.addRow([header.subtitle||""]); Es.addRow([]);
  Es.addRow(["People", n]);
  REGIONS.forEach(([reg,label,k]) => Es.addRow([`${label} nights`, num(bset["nights"+k]), bset["label"+k]||""]));
  Es.addRow(["Total nights", { formula:"SUM(B5:B7)", result:nights }]);
  [4,5,6,7,8].forEach(r => Es.getCell(`A${r}`).font = { bold:true }); Es.getCell("B4").fill = { type:"pattern", pattern:"solid", fgColor:{argb:"FFFFF1CC"} };
  Es.addRow([]);
  Es.addRow(["Booked items (counted)","How it's paid","Group cost","Per person"]); hdr(Es,10);
  const first = 11; 
  const put = (label,how,ref,val) => { const r = Es.rowCount+1; Es.addRow([label,how,{ formula:ref, result:val },{ formula:`C${r}/${PEOPLE}`, result:val/n }]); };
  E.lodging.forEach(Lg => Lg.booked.forEach(b => put(`Lodging · ${Lg.label}: ${b.listing.name} (${Lg.nights} nights)`,"Split among the group",`${qs("Lodging")}!I${lodRow[b.listing.id]}`,b.total)));
  if(E.vanCounted) put(`Passenger van (${nights} days)`,"Split among the group",`${qs("Van rental")}!E${vTot}`,E.van.total);
  E.cats.forEach(c => c.booked.forEach(x => put(`${CATS[c.cat].label}: ${x.i.title}`, typeLabel(x.type)+(x.type==="each"?` (${money(x.amt)} × ${n})`:""), `${qs(SHEET[c.cat])}!F${catRow[c.cat][x.i.id]}`, x.group)));
  const lastC = Es.rowCount, tr = lastC+1;
  Es.addRow(["TOTAL BOOKED","", lastC>=first ? { formula:`SUM(C${first}:C${lastC})`, result:E.total } : 0, { formula:`C${tr}/${PEOPLE}`, result:E.total/n }]);
  Es.getRow(tr).font = { bold:true, size:12 }; sect(Es,tr);
  Es.addRow([]); Es.addRow(["Not booked yet (not counted)","","Group cost","Per person"]); hdr(Es,Es.rowCount);
  const soft = (label,how,val,ref) => { const r = Es.rowCount+1; Es.addRow([label,how,ref?{ formula:ref, result:val }:val,{ formula:`C${r}/${PEOPLE}`, result:val/n }]); Es.getRow(r).font = { italic:true, color:{argb:"FF5C7378"} }; };
  E.lodging.forEach(Lg => { if(!Lg.booked.length && Lg.preview) soft(`Lodging · ${Lg.label}: ${Lg.preview.name} (preview)`,"Split among the group",Lg.previewTotal,`${qs("Lodging")}!I${lodRow[Lg.preview.id]}`); });
  if(!E.vanCounted) soft(`Passenger van (${nights} days)`,"Split among the group",E.van.total,`${qs("Van rental")}!E${vTot}`);
  E.cats.forEach(c => { if(c.other.length) soft(`${CATS[c.cat].label}: ${c.other.length} not booked`,"",c.potential); });
  widths(Es,[58,34,16,16]); fmt(Es,[3,4],MONEY); Es.getCell("B4").numFmt = "0"; Es.getCell("B8").numFmt = "0";
  Es.getRow(9).height = 6;

  [...pn].sort((a,b) => (a.cat+a.itemId+a.name).localeCompare(b.cat+b.itemId+b.name)).forEach(x => T.addRow([CATS[x.cat]?.label||x.cat, titleOf(x.cat,x.itemId)||"(deleted)", x.name, x.text]));
  widths(T,[22,40,16,80]); T.getColumn(4).alignment = { wrapText:true, vertical:"top" }; T.mergeCells("A2:D2"); T.getRow(2).height = Math.min(400, 16*Math.max(3,(overview.text||"").split("\n").length+1));

}
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  const urls = ["https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js","https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"];
  const tryLoad = i => new Promise((res,rej) => { const el = document.createElement("script"); el.src = urls[i]; el.onload = res; el.onerror = () => { el.remove(); i+1<urls.length ? tryLoad(i+1).then(res,rej) : rej(new Error("Could not load the Excel library")); }; document.head.appendChild(el); });
  return tryLoad(0);
}
async function exportExcel(btn,msg){
  btn.disabled = true; if(msg) msg.textContent = "Building…";
  try{
    await loadExcelJS();
    const buf = await buildWorkbook(window.ExcelJS).xlsx.writeBuffer();
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    a.download = `Vamos_PR_${new Date().toISOString().slice(0,10)}.xlsx`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    if(msg) msg.textContent = "Downloaded ✔";
  }catch(err){ console.error(err); if(msg) msg.textContent = "Export failed: "+(err.message||err); }
  btn.disabled = false;
}

/* ---------- Fit tables to the window: boxes grow to show all their text, and the whole table (font + boxes) scales down to fit ---------- */
const FIT_MIN = 0.55;                       // below this, the table scrolls sideways instead
const FIELD_MAX = { name:380, title:380, notes:260, link:90, parking:140 };
let _cx = null;
function textW(el, txt){
  _cx = _cx || document.createElement("canvas").getContext("2d"); const cs = getComputedStyle(el);
  _cx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const ls = parseFloat(cs.letterSpacing)||0, ws = parseFloat(cs.wordSpacing)||0;
  return _cx.measureText(txt).width + txt.length*ls + (txt.split(" ").length-1)*ws;
}
function autosize(el){
  const cs = getComputedStyle(el);
  const pad = [cs.paddingLeft,cs.paddingRight,cs.borderLeftWidth,cs.borderRightWidth].reduce((a,v)=>a+(parseFloat(v)||0),0);
  const txt = String(el.value || el.placeholder || ""), isNum = el.type==="number";
  const max = FIELD_MAX[el.dataset.field || ""] || 220, min = isNum ? 64 : 64;
  el.style.width = Math.min(max, Math.max(min, Math.ceil(textW(el,txt) + pad + 10 + (isNum ? 20 : 0)))) + "px";
}
function fitTables(){
  const zoomOK = typeof CSS !== "undefined" && CSS.supports && CSS.supports("zoom","1");
  document.querySelectorAll("#app .tbl").forEach(box => {
    let fit = box.firstElementChild;
    if(!fit || !fit.classList.contains("fit")){ fit = document.createElement("div"); fit.className = "fit"; while(box.firstChild) fit.appendChild(box.firstChild); box.appendChild(fit); }
    fit.style.zoom = "1";
    fit.querySelectorAll("input").forEach(autosize);
    if(!zoomOK) return;
    const natural = fit.scrollWidth, avail = box.clientWidth;
    fit.style.zoom = natural > avail ? String(Math.max(FIT_MIN, avail/natural)) : "1";
  });
}
let _fitQ = 0; const queueFit = () => { cancelAnimationFrame(_fitQ); _fitQ = requestAnimationFrame(fitTables); };
new MutationObserver(queueFit).observe($app, { childList:true, subtree:true });
new MutationObserver(queueFit).observe(document.body, { attributes:true, attributeFilter:["class"] });
window.addEventListener("resize", queueFit); window.addEventListener("orientationchange", queueFit);
document.addEventListener("input", e => { if(e.target.closest && e.target.closest(".tbl")) queueFit(); });
if(document.fonts){ document.fonts.ready.then(queueFit); document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", queueFit); }

boot();
