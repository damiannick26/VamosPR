<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vamos PR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* OpenDyslexic (dyslexia-friendly). Falls back to Lexend, which is also designed for easy reading. */
  @font-face{
    font-family:"OpenDyslexic";
    src:url("https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic/files/opendyslexic-latin-400-normal.woff2") format("woff2");
    font-weight:400; font-display:swap;
  }
  @font-face{
    font-family:"OpenDyslexic";
    src:url("https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic/files/opendyslexic-latin-700-normal.woff2") format("woff2");
    font-weight:700; font-display:swap;
  }
  :root{
    --sand:#fff6e0; --card:#ffffff; --ink:#1d3b40; --muted:#5c7378; --line:#f0dfb8;
    --ocean:#0a8f9c; --deep:#066673; --coral:#ff6b4a; --hibiscus:#e83e8c; --sun:#ffc93c; --palm:#2fa66a;
    --radius:18px;
    --font:"OpenDyslexic","Lexend",system-ui,sans-serif;
  }
  body.clean{ --font:"Lexend",system-ui,sans-serif; }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:var(--font); font-size:16px; line-height:1.75; letter-spacing:.03em; word-spacing:.12em;
    color:var(--ink); background:var(--sand);
    background-image:radial-gradient(circle at 12% 8%, #ffe9a8 0, transparent 40%), radial-gradient(circle at 92% 30%, #ffd7c7 0, transparent 35%);
    background-attachment:fixed; text-align:left;
  }
  header{
    position:relative; color:#fff; padding:20px 16px 0;
    background:linear-gradient(160deg,#ff8a4a 0%, #ff6b4a 25%, #e83e8c 55%, #0a8f9c 100%);
    overflow:hidden;
  }
  header::before{ content:"☀️"; position:absolute; right:16px; top:8px; font-size:3rem; opacity:.9; }
  header::after{ content:"🌴  🌺  🥥  🌴"; position:absolute; left:16px; bottom:56px; font-size:1.1rem; opacity:.55; letter-spacing:.5em; }
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
  header h1{margin:0;font-size:1.7rem;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.15)}
  header .sub{opacity:.95;font-size:.95rem}
  .who{font-size:.78rem;text-align:right;position:relative;z-index:1;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:12px;margin-top:44px}
  .who button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
  nav{display:flex;gap:6px;overflow-x:auto;margin:16px -4px 0;padding:0 4px 14px;position:relative;z-index:1}
  nav button{flex:0 0 auto;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700}
  nav button.on{background:#fff;color:var(--deep);border-color:#fff}
  .wave{display:block;width:100%;height:28px;margin-top:-1px}
  main{max-width:840px;margin:0 auto;padding:12px 16px 40px}
  .card{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--ocean);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:0 3px 0 rgba(10,143,156,.08)}
  .card.plain{border-left-width:2px}
  .c-lodging{border-left-color:var(--ocean)} .c-transport{border-left-color:var(--sun)} .c-flights{border-left-color:var(--hibiscus)}
  .c-activities{border-left-color:var(--coral)} .c-places{border-left-color:var(--palm)} .c-food{border-left-color:#8e5bd6}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input,textarea,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fffdf7;color:var(--ink);font:inherit;font-size:.95rem}
  input:focus,textarea:focus,select:focus{outline:3px solid var(--sun);border-color:var(--ocean)}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 3px;font-weight:700}
  .btn{background:var(--coral);color:#fff;border:0;padding:10px 18px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #c9492c}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9492c}
  .btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--line);box-shadow:none}
  .btn.small{padding:4px 12px;font-size:.78rem}
  .item h3{margin:0 0 4px;font-size:1.05rem;line-height:1.5}
  .meta{color:var(--muted);font-size:.84rem;display:flex;gap:12px;flex-wrap:wrap;margin:4px 0}
  .tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.7rem;font-weight:700;background:var(--sun);color:#4a3500;vertical-align:middle}
  .tag.Booked,.tag.Done{background:var(--palm);color:#fff}
  .tag.Idea{background:#e9e2cf;color:var(--ink)}
  .tag.Planned{background:var(--hibiscus);color:#fff}
  .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}
  .chat{display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:340px}
  .msgs{flex:1;overflow-y:auto;padding:6px}
  .msg{max-width:82%;margin:8px 0;padding:8px 14px;border-radius:18px 18px 18px 4px;background:#fff;border:2px solid var(--line);word-wrap:break-word;white-space:pre-wrap}
  .msg.me{margin-left:auto;background:var(--ocean);color:#fff;border-color:var(--ocean);border-radius:18px 18px 4px 18px}
  .msg .n{font-size:.68rem;opacity:.8;font-weight:700}
  .msg .e{font-size:.68rem;margin-top:2px}
  .msg .e button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:0 6px 0 0;opacity:.85}
  .chatbar{display:flex;gap:8px;margin-top:8px}
  .overlay{max-width:460px;margin:8vh auto;padding:0 16px}
  .err{color:#c0301a;font-size:.9rem}
  .saved{color:var(--palm);font-size:.85rem;font-weight:700}
  a{color:var(--deep);font-weight:700}
  code{background:var(--line);padding:1px 6px;border-radius:6px;font-size:.85em}
  .fontbtn{position:fixed;right:12px;bottom:12px;z-index:9}
  .tile{flex:1 1 120px;text-align:center;cursor:pointer}
  .tile .big{font-size:1.8rem}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .subtabs button{border:2px solid var(--line);background:#fff;color:var(--deep);padding:8px 14px;border-radius:99px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
  .subtabs button.on{background:var(--ocean);color:#fff;border-color:var(--ocean)}
  .tbl{overflow-x:auto;margin:8px 0}
  .tbl table{border-collapse:collapse;width:100%;font-size:.85rem}
  .tbl th{text-align:left;font-size:.72rem;color:var(--muted);padding:4px 6px;white-space:nowrap}
  .tbl td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
  .tbl input,.tbl select{width:auto;min-width:50px;padding:5px 8px;font-size:.85rem;border-radius:8px}
  .tbl tr.sel td{background:#e6f7f4}
  .tbl tr.tot td{font-weight:700;border-top:3px solid var(--ocean);font-size:1rem}
  .warn{color:#c0301a;font-weight:700;font-size:.75rem}
  .tbl tr.muted td{color:var(--muted);font-style:italic;background:#fbf4e2}
  .entry{border:2px dashed var(--line);border-radius:14px;padding:6px 12px 10px;margin:10px 0;background:#fffdf7}
  .entry-h{display:flex;justify-content:space-between;align-items:center;color:var(--deep)}
  .ok{color:var(--palm);font-weight:700;font-size:.82rem}
  .muted-note{color:var(--muted);font-size:.82rem;font-style:italic}
</style>
</head>
<body>
<div id="app"></div>
<button class="btn ghost small fontbtn" id="fontbtn" title="Switch font">Aa</button>

<script type="module">
/* Firebase web config (safe to publish; it identifies the project, it is not a secret) */
const firebaseConfig = {
  apiKey: "AIzaSyATboR8tMjADmP0wa19g0Njs8PtJyUqRXo",
  authDomain: "vamospr-badf7.firebaseapp.com",
  projectId: "vamospr-badf7",
  storageBucket: "vamospr-badf7.firebasestorage.app",
  messagingSenderId: "876412272501",
  appId: "1:876412272501:web:186e132c79024ee9de9d3c"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
         query, orderBy, serverTimestamp, arrayUnion, arrayRemove, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}, del:k=>{try{localStorage.removeItem(k)}catch{}} };

/* Font toggle: OpenDyslexic (default) <-> Lexend */
function applyFont(){ document.body.classList.toggle("clean", ls.get("pr_font")==="clean"); }
applyFont();
document.getElementById("fontbtn").onclick = () => { ls.set("pr_font", ls.get("pr_font")==="clean" ? "dys" : "clean"); applyFont(); };

const CATS = {
  lodging:   { label:"Lodging",     icon:"🏡", titlePh:"e.g. Beach house in Rincón",      dateLabel:"Dates", statuses:["Idea","Considering","Booked"] },
  transport: { label:"Transport",   icon:"🚗", titlePh:"e.g. Rental car from SJU",        dateLabel:"Date",  statuses:["Idea","Considering","Booked"] },
  flights:   { label:"Flights",     icon:"✈️", titlePh:"e.g. CLE → SJU, Feb 9",           dateLabel:"Date",  statuses:["Idea","Considering","Booked"] },
  activities:{ label:"Activities",  icon:"🤿", titlePh:"e.g. Kayak the bioluminescent bay", dateLabel:"Date", statuses:["Idea","Planned","Booked","Done"] },
  places:    { label:"Places",      icon:"🏝️", titlePh:"e.g. El Yunque",                  dateLabel:"When",  statuses:["Idea","Planned","Booked","Done"] },
  food:      { label:"Restaurants", icon:"🍹", titlePh:"e.g. Lechonera in Guavate",       dateLabel:"When",  statuses:["Idea","Planned","Booked","Done"] },
};
const TABS = ["chat","overview","budget",...Object.keys(CATS)];
const TAB_LABEL = { chat:"💬 Chat", overview:"🗺️ Overview", budget:"💰 Budget", ...Object.fromEntries(Object.entries(CATS).map(([k,v])=>[k,v.icon+" "+v.label])) };

let db, tripCode = ls.get("pr_trip"), me = ls.get("pr_name"), tab = ls.get("pr_tab") || "overview";
let unsubs = [], data = {}, messages = [];
let overview = { text:"" };
let header = { title:"Vamos PR", subtitle:"Puerto Rico trip planner · Feb 2027" };
let editing = null, editingHeader = false;

function boot(){
  db = getFirestore(initializeApp(firebaseConfig));
  if(!tripCode || !me){ return renderJoin(); }
  startListening();
  renderShell();
}

function renderJoin(err=""){
  $app.innerHTML = `<div class="overlay"><div class="card plain">
    <h2>¡Vamos a Puerto Rico! 🇵🇷🌴</h2>
    <p style="color:var(--muted)">Enter your name and the trip code your group shares. Anyone with the same code sees the same trip.</p>
    <label>Your name</label><input id="jn" value="${esc(me||"")}" maxlength="30" placeholder="e.g. Damian">
    <label>Trip code</label><input id="jc" value="${esc(tripCode||"")}" maxlength="40" placeholder="e.g. pr-feb-2027-x7k2q9">
    <p class="err" id="je">${esc(err)}</p>
    <button class="btn" id="jb">Join trip</button>
  </div></div>`;
  document.getElementById("jb").onclick = () => {
    const n = document.getElementById("jn").value.trim();
    const c = document.getElementById("jc").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
    if(!n) return renderJoin("Please enter your name.");
    if(c.length < 8) return renderJoin("Trip code needs at least 8 letters/numbers (a-z, 0-9, - or _).");
    me = n; tripCode = c; ls.set("pr_name", n); ls.set("pr_trip", c);
    boot();
  };
}

const tripRef = (...p) => [db, "trips", tripCode, ...p];

function startListening(){
  unsubs.forEach(u=>u()); unsubs = []; data = {};
  for(const cat of Object.keys(CATS)){
    unsubs.push(onSnapshot(query(collection(...tripRef(cat)), orderBy("createdAt","asc")), snap => {
      data[cat] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if(tab===cat && !editing) renderBody();
      if(tab==="overview" && !isTyping()) renderBody();
      if(tab==="budget") refreshBudget();
    }, showErr));
  }
  unsubs.push(onSnapshot(query(collection(...tripRef("messages")), orderBy("createdAt","asc")), snap => {
    messages = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(tab==="chat") renderChatMsgs(true);
  }, showErr));
  unsubs.push(onSnapshot(doc(...tripRef("meta","overview")), s => {
    overview = s.exists() ? s.data() : { text:"" };
    if(tab==="overview" && !isTyping()) renderBody();
  }, showErr));
  unsubs.push(onSnapshot(doc(...tripRef("meta","header")), s => {
    if(s.exists()) header = { ...header, ...s.data() };
    if(!editingHeader) renderHeaderText();
  }, showErr));
  listenBudget();
}
const isTyping = () => document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

function showErr(e){
  console.error(e);
  const el = document.getElementById("body");
  if(el && !el.querySelector(".conn-err")) el.insertAdjacentHTML("afterbegin", `<div class="card conn-err err">Connection problem: ${esc(e.code||e.message)}. Check your Firestore rules.</div>`);
}

function renderShell(){
  $app.innerHTML = `
  <header>
    <div class="top">
      <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div>
        <button class="btn ghost small" id="hEdit" style="margin-top:6px">✏️ Edit title</button></div>
      <div class="who">${esc(me)}<br><button id="leave">switch</button></div>
    </div>
    <nav id="nav">${TABS.map(t=>`<button data-t="${t}" class="${t===tab?"on":""}">${TAB_LABEL[t]}</button>`).join("")}</nav>
  </header>
  <svg class="wave" viewBox="0 0 1200 28" preserveAspectRatio="none"><path d="M0 14 Q 75 0 150 14 T 300 14 T 450 14 T 600 14 T 750 14 T 900 14 T 1050 14 T 1200 14 V0 H0Z" fill="#0a8f9c"/></svg>
  <main id="body"></main>`;
  renderHeaderText();
  document.getElementById("hEdit").onclick = editHeader;
  document.getElementById("leave").onclick = () => { ls.del("pr_name"); ls.del("pr_trip"); me=null; tripCode=null; unsubs.forEach(u=>u()); renderJoin(); };
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { tab=b.dataset.t; ls.set("pr_tab",tab); editing=null;
    document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b)); renderBody(); });
  renderBody();
}

function renderHeaderText(){
  const t = document.getElementById("hTitle"), s = document.getElementById("hSub"); if(!t) return;
  t.textContent = header.title + " 🌴"; s.textContent = header.subtitle;
  document.getElementById("hEdit").style.display = "";
}
function editHeader(){
  editingHeader = true;
  document.getElementById("hTitle").innerHTML = `<input id="ht" value="${esc(header.title)}" maxlength="60">`;
  document.getElementById("hSub").innerHTML = `<input id="hs" value="${esc(header.subtitle)}" maxlength="100" style="margin-top:6px">`;
  const b = document.getElementById("hEdit"); b.textContent = "💾 Save title";
  b.onclick = async () => {
    const title = document.getElementById("ht").value.trim() || "Vamos PR";
    const subtitle = document.getElementById("hs").value.trim();
    try { await setDoc(doc(...tripRef("meta","header")), { title, subtitle, updatedBy:me, updatedAt:serverTimestamp() }); } catch(e){ showErr(e); }
    header = { title, subtitle }; editingHeader = false; b.textContent = "✏️ Edit title"; b.onclick = editHeader; renderHeaderText();
  };
}

function renderBody(){
  const body = document.getElementById("body"); if(!body) return;
  body.onchange = null; body.onclick = null;
  if(tab==="chat") return renderChat(body);
  if(tab==="overview") return renderOverview(body);
  if(tab==="budget") return renderBudget(body);
  if(tab==="lodging") return renderLodging(body);
  renderCategory(body, tab);
}

/* ---------- Chat (edit + delete your own messages) ---------- */
function renderChat(body){
  body.innerHTML = `<div class="chat"><div class="msgs" id="msgs"></div>
    <form class="chatbar" id="cf"><input id="ci" placeholder="Message the group…" autocomplete="off" maxlength="1000"><button class="btn">Send</button></form></div>`;
  renderChatMsgs(true);
  document.getElementById("cf").onsubmit = async e => {
    e.preventDefault();
    const i = document.getElementById("ci"), t = i.value.trim(); if(!t) return;
    i.value = "";
    try { await addDoc(collection(...tripRef("messages")), { text:t, name:me, createdAt:serverTimestamp() }); } catch(err){ showErr(err); }
  };
}
function renderChatMsgs(scroll){
  const box = document.getElementById("msgs"); if(!box) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = messages.length ? messages.map(m => `<div class="msg ${m.name===me?"me":""}"><div class="n">${esc(m.name)}${fmtTime(m.createdAt)}${m.edited?" · edited":""}</div>${esc(m.text)}
      ${m.name===me?`<div class="e"><button data-me="${m.id}">edit</button><button data-md="${m.id}">delete</button></div>`:""}</div>`).join("")
    : `<div class="empty">No messages yet. Say hola! 👋</div>`;
  box.querySelectorAll("[data-me]").forEach(b => b.onclick = async () => {
    const m = messages.find(x=>x.id===b.dataset.me); const t = prompt("Edit message", m.text); if(t===null || !t.trim()) return;
    try { await updateDoc(doc(...tripRef("messages",m.id)), { text:t.trim(), edited:true }); } catch(e){ showErr(e); }
  });
  box.querySelectorAll("[data-md]").forEach(b => b.onclick = async () => {
    if(confirm("Delete this message?")) try { await deleteDoc(doc(...tripRef("messages",b.dataset.md))); } catch(e){ showErr(e); }
  });
  if(scroll && (nearBottom || messages.length<2)) box.scrollTop = box.scrollHeight;
}
function fmtTime(ts){ if(!ts?.toDate) return ""; const d=ts.toDate(); return " · "+d.toLocaleDateString([], {month:"short",day:"numeric"})+" "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }

/* ---------- Overview ---------- */
const DEFAULT_OVERVIEW = `Who's going & when
• Catherine, Damian: Feb 9 – Feb 19
• Sara, Thomas, Amy, Jenna, Dave: Feb 12 – Feb 19

Notes, reminders, group links…`;
function renderOverview(body){
  const tiles = Object.entries(CATS).map(([k,v])=>`<div class="card tile c-${k}" data-go="${k}"><div class="big">${v.icon}</div><b>${(k==="lodging" ? bAir : (data[k]||[])).length}</b><div class="meta" style="justify-content:center">${v.label}</div></div>`).join("");
  body.innerHTML = `${budgetSummaryCard()}<div class="row">${tiles}</div>
    <div class="card plain"><b>📝 Trip notes</b> <span class="meta">anyone can edit · click Save when done</span>
    <textarea id="ovText" style="min-height:240px">${esc(overview.text || DEFAULT_OVERVIEW)}</textarea>
    <div class="actions"><button class="btn" id="ovSave">💾 Save notes</button><span class="saved" id="ovMsg"></span></div></div>`;
  body.querySelectorAll("[data-go]").forEach(c => c.onclick = () => document.querySelector(`#nav [data-t="${c.dataset.go}"]`).click());
  document.getElementById("ovSave").onclick = async () => {
    try {
      await setDoc(doc(...tripRef("meta","overview")), { text:document.getElementById("ovText").value, updatedBy:me, updatedAt:serverTimestamp() });
      document.getElementById("ovMsg").textContent = "Saved ✔";
    } catch(err){ showErr(err); }
  };
}

/* ---------- Categories ---------- */
function renderCategory(body, cat){
  const C = CATS[cat], items = data[cat] || [];
  body.innerHTML = `<div class="card plain"><button class="btn" id="addb">+ Add to ${C.label}</button></div><div id="form"></div>
    <div id="list">${items.length ? items.map(i => itemCard(cat,i)).join("") : `<div class="empty">Nothing here yet. Add the first ${C.label.toLowerCase()} idea! 🌺</div>`}</div>`;
  document.getElementById("addb").onclick = () => openForm(cat);
  body.querySelectorAll("[data-act]").forEach(b => b.onclick = () => itemAction(cat, b.dataset.id, b.dataset.act));
}

function itemCard(cat,i){
  const votes = i.votes || [], voted = votes.includes(me);
  const link = i.link ? `<a href="${esc(/^https?:\/\//.test(i.link)?i.link:"https://"+i.link)}" target="_blank" rel="noopener">link ↗</a>` : "";
  return `<div class="card item c-${cat}">
    <h3>${esc(i.title)} <span class="tag ${esc(i.status)}">${esc(i.status||"Idea")}</span></h3>
    <div class="meta">${i.date?`<span>📅 ${esc(i.date)}</span>`:""}${costLine(cat,i)}${i.who?`<span>👥 ${esc(i.who)}</span>`:""}${link}</div>
    ${i.notes?`<div style="white-space:pre-wrap">${esc(i.notes)}</div>`:""}
    <div class="meta">added by ${esc(i.addedBy||"?")}${i.updatedBy&&i.updatedBy!==i.addedBy?` · edited by ${esc(i.updatedBy)}`:""}</div>
    <div class="actions">
      <button class="btn ghost small" data-act="vote" data-id="${i.id}">${voted?"👍 Voted":"👍 Vote"} ${votes.length||""}</button>
      <button class="btn ghost small" data-act="edit" data-id="${i.id}">✏️ Edit</button>
      <button class="btn ghost small" data-act="del" data-id="${i.id}">🗑️ Delete</button>
    </div></div>`;
}

async function itemAction(cat,id,act){
  const item = (data[cat]||[]).find(x=>x.id===id); if(!item) return;
  try{
    if(act==="vote") await updateDoc(doc(...tripRef(cat,id)), { votes: (item.votes||[]).includes(me) ? arrayRemove(me) : arrayUnion(me) });
    if(act==="del" && confirm(`Delete "${item.title}"?`)) await deleteDoc(doc(...tripRef(cat,id)));
    if(act==="edit") openForm(cat, item);
  }catch(e){ showErr(e); }
}

/*BATCH_START*/

const bnv = v => v==="" ? null : Number(v);
const entryShell = (n,inner,removable) => `<div class="entry"><div class="entry-h"><b>Entry <span class="en">${n}</span></b>${removable?`<button type="button" class="btn ghost small" data-rm tabindex="-1">✕ remove</button>`:""}</div>${inner}</div>`;

const gv = (b,k) => b.querySelector(`[data-k="${k}"]`).value.trim();
function appendBlock(box, html){
  box.insertAdjacentHTML("beforeend", html); renumber(box);
  const nb = box.lastElementChild; if(nb.scrollIntoView) nb.scrollIntoView({block:"nearest",behavior:"smooth"});
  nb.querySelector("input").focus();
}
function wireBatch(box, addBlock){
  box.addEventListener("keydown", e => {
    if(e.key!=="Tab" || e.shiftKey) return;
    const last = box.lastElementChild; if(!last || !last.contains(e.target)) return;
    const fields = [...last.querySelectorAll("input,select,textarea")];
    if(e.target!==fields[fields.length-1] || !fields[0].value.trim()) return;  // only auto-start when this entry has a title/name
    e.preventDefault(); addBlock();
  });
  box.addEventListener("click", e => {
    const r = e.target.closest("[data-rm]"); if(!r) return;
    r.closest(".entry").remove(); renumber(box);
  });
}
const ni = (k,label,w) => `<div style="flex:1 1 ${w}px"><label>${label}</label><input data-k="${k}" type="number" min="0" step="any"></div>`;
function lodgeBlock(n, region, removable){

  const dayCost = num(S.vanDay)*extra;
  const lines = bVan.map(l => { const qtyUsed = (l.qty===null||l.qty===undefined||l.qty==="") ? days : num(l.qty); return { ...l, qtyUsed, amt:num(l.rate)*qtyUsed }; });
  const subtotal = week + dayCost + sum(lines.map(l=>l.amt));
  const tax = subtotal*num(S.taxPct)/100;
  const total = subtotal + tax;
  return { week, extra, dayCost, lines, subtotal, tax, total, pp: total/people };
}
function calcEstimate(){
  const S = bset, n = Math.max(1,num(S.people));
  const nights = num(S.nightsSj)+num(S.nightsEast)+num(S.nightsWest);
  const van = vanCalc(nights);
  const vanCounted = S.vanStatus==="Booked";
  const lodging = [["sj","San Juan","Sj"],["e","Eastern","East"],["w","Western","West"]].map(([reg,label,k]) => {
    const nt = num(S["nights"+k]);
    const booked = bAir.filter(x => x.region===reg && x.status==="Booked").map(x => ({ listing:x, total:perNight(x)*nt }));
    const preview = bAir.find(x => x.id===S["sel"+k] && x.region===reg);
    const bookedTotal = sum(booked.map(b=>b.total));
    return { k, reg, label, nights:nt, booked, bookedTotal, preview, previewTotal:perNight(preview)*nt };
  });
  const cats = EST_CATS.map(cat => {
    const items = (data[cat]||[]).map(i => ({ i, ...itemCost(cat,i,n) }));
    const booked = items.filter(x => x.i.status==="Booked"), other = items.filter(x => x.i.status!=="Booked");
    return { cat, booked, other, bookedTotal:sum(booked.map(x=>x.group)), potential:sum(other.map(x=>x.group)) };
  });
  const total = sum(lodging.map(l=>l.bookedTotal)) + (vanCounted ? van.total : 0) + sum(cats.map(c=>c.bookedTotal));
  return { n, nights, van, vanCounted, lodging, cats, total, pp: total/n };
}
/*CALC_END*/

function listenBudget(){
  unsubs.push(onSnapshot(doc(...tripRef("meta","budget")), s => {
    if(s.exists()){ bset = { ...BUDGET_DEFAULT, ...s.data() }; if(!s.data().v) migrateBudget(s.data()); }
    else if(!s.metadata.fromCache) seedBudget();
    refreshBudget();
  }, showErr));
  const watch = (col,set) => unsubs.push(onSnapshot(query(collection(...tripRef(col)), orderBy("order","asc")), snap => {
    set(snap.docs.map(d => ({ id:d.id, ...d.data() }))); refreshBudget();
  }, showErr));
  watch("budget_airbnb", v => bAir = v); watch("budget_van", v => bVan = v);
}
function refreshBudget(){
  if(tab!=="budget" && tab!=="overview" && tab!=="lodging") return;
  if(tab==="lodging" && lForm) return;
  if(isTyping()){ pendingRender = true; return; }
  renderBody();
}
document.addEventListener("focusout", () => setTimeout(() => { if(pendingRender && !isTyping() && !(tab==="lodging" && lForm)){ pendingRender = false; renderBody(); } }, 0));

/* Spreadsheet activities/flights become normal items on the Activities and Flights tabs */
function seedItemWrites(b, flight){
  ACT_SEED.forEach(([title,amount],i) => b.set(doc(...tripRef("activities","seed-act-"+(i+1))), { title, date:"", cost:"", amount, costType:"each", status:"Planned", link:"", who:"", notes:"Imported from the spreadsheet", addedBy:"spreadsheet", votes:[], createdAt:serverTimestamp() }));
  b.set(doc(...tripRef("flights","seed-flt-1")), { title:"Flights (from spreadsheet)", date:"", cost:"", amount:flight.amount, costType:flight.costType, status:"Idea", link:"", who:"", notes:"The spreadsheet counted this as both a group total and a per-person price. Check the amount and the Who pays? setting.", addedBy:"spreadsheet", votes:[], createdAt:serverTimestamp() });
}
async function seedBudget(){
  if(seeding) return; seeding = true;
  try{
    const b = writeBatch(db);
    AIRBNB_SEED.forEach(r => { const { id, ...rest } = r; b.set(doc(...tripRef("budget_airbnb",id)), { ...rest, createdAt:serverTimestamp() }); });
    VAN_SEED.forEach(([name,rate,qty,note],i) => b.set(doc(...tripRef("budget_van","v"+(i+1))), { name, rate, qty, note, order:i+1 }));
    seedItemWrites(b, { amount:882, costType:"each" });
    b.set(doc(...tripRef("meta","budget")), { ...BUDGET_DEFAULT, updatedBy:me, updatedAt:serverTimestamp() });
    await b.commit();
  }catch(e){ seeding = false; showErr(e); }
}
/* For a trip that already imported the first version of the spreadsheet */
async function migrateBudget(old){
  if(seeding) return; seeding = true;
  try{
    const b = writeBatch(db);
    seedItemWrites(b, { amount:num(old.flights)||882, costType: old.flightsMode==="total" ? "split" : "each" });
    b.set(doc(...tripRef("meta","budget")), { v:2, vanStatus:"Idea", flights:deleteField(), flightsMode:deleteField(), updatedBy:me, updatedAt:serverTimestamp() }, { merge:true });
    await b.commit();
  }catch(e){ seeding = false; showErr(e); }
}

const setNum = (k,w=80) => `<input type="number" min="0" step="any" data-set="${k}" data-type="num" value="${esc(bset[k]??"")}" style="width:${w}px">`;
const setTxt = (k,w=110) => `<input data-set="${k}" value="${esc(bset[k]??"")}" maxlength="30" style="width:${w}px">`;
const statusSel = (key,val,opts) => `<select data-set="${key}">${opts.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`;
const typeLabel = t => (COST_TYPES.find(x=>x[0]===t)||[])[1] || "";

function costLine(cat,i){
  const n = Math.max(1,num(bset.people)), amt = num(i.amount);
  const note = i.cost ? `<span>📝 ${esc(i.cost)}</span>` : "";
  if(!amt) return note;
  const c = itemCost(cat,i,n);
  const txt = c.type==="split" ? `${money(amt)} split ${n} ways (${money(amt/n)} each)`
            : c.type==="one" ? `${money(amt)} · one person${i.who?` (${esc(i.who)})`:""}`
            : `${money(amt)} each × ${n} = ${money(amt*n)}`;
  return `<span>💵 ${txt}</span><span class="${i.status==="Booked"?"ok":"muted-note"}">${i.status==="Booked"?"✔ counts toward budget":"not counted until Booked"}</span>${note}`;
}

function renderBudget(body){
  const labels = { estimate:"🧮 Estimate", van:"🚐 Van rental" };
  body.innerHTML = `<div class="subtabs">${Object.entries(labels).map(([k,l]) => `<button data-bt="${k}" class="${k===bTab?"on":""}">${l}</button>`).join("")}</div><div id="bbody"></div>`;

function estimateHTML(){
  const E = calcEstimate(), S = bset, n = E.n;
  const basics = `<div class="card plain"><b>⚙️ Trip basics</b>
    <div class="row" style="align-items:center;margin:6px 0"><span style="min-width:130px">People</span>${setNum("people",70)}</div>
    ${REGIONS.map(([reg,label,k]) => `<div class="row" style="align-items:center;margin:4px 0"><span style="min-width:130px">${label} nights</span>${setNum("nights"+k,70)}${setTxt("label"+k,120)}</div>`).join("")}
    <div class="meta">Total nights: <b>${E.nights}</b> (this sets the van rental length)</div></div>`;
  const R = (cells,cls="") => `<tr class="${cls}">${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`;
  const lodgingRows = E.lodging.map(L => {
    const sub = `${L.nights} nights${S["label"+L.k]?` · ${esc(S["label"+L.k])}`:""}`;
    if(L.booked.length) return L.booked.map(b => R([`🏡 ${L.label}: ${esc(b.listing.name)}<div class="meta">${sub}</div>`,"Split among the group",money(b.total),money(b.total/n)])).join("");
    const opts = bAir.filter(x => x.region===L.reg).map(x => `<option value="${esc(x.id)}" ${x.id===S["sel"+L.k]?"selected":""}>${esc(x.name)} — ${money(perNight(x))}/night</option>`).join("");
    return R([`🏡 ${L.label}: nothing booked yet<div class="meta">${sub}</div>`,`preview: <select data-set="sel${L.k}" style="max-width:240px"><option value="">— choose —</option>${opts}</select>`,`${money(L.previewTotal)} <span class="warn">not counted</span>`,money(L.previewTotal/n)],"muted");
  }).join("");
  const vanRow = R([`🚐 Passenger van<div class="meta">${E.nights} days</div>`,`${statusSel("vanStatus",S.vanStatus,["Idea","Considering","Booked"])} <button class="btn ghost small" data-do="goto" data-to="van">details</button>`,`${money(E.van.total)}${E.vanCounted?"":` <span class="warn">not counted</span>`}`,money(E.van.pp)], E.vanCounted?"":"muted");
  const catRows = E.cats.map(c => {
    const C = CATS[c.cat];
    const rows = c.booked.map(x => R([`${C.icon} ${esc(x.i.title)}${x.i.who?`<div class="meta">${esc(x.i.who)}</div>`:""}`, typeLabel(x.type)+(x.type==="each"?` (${money(x.amt)} × ${n})`:""), money(x.group), money(x.pp)])).join("");
    const rest = c.other.length ? R([`${C.icon} ${C.label}: ${c.other.length} not booked yet`,`<button class="btn ghost small" data-do="gotoTab" data-to="${c.cat}">open tab</button>`,`${money(c.potential)} <span class="warn">not counted</span>`,money(c.potential/n)],"muted") : "";
    return rows + rest;
  }).join("");
  return `${basics}<div class="card plain"><b>🧮 Cost estimate</b> <span class="meta">only Booked items count</span>
    <div class="tbl"><table><thead><tr><th>Item</th><th>How it's paid</th><th>Group cost</th><th>Avg per person</th></tr></thead><tbody>
    ${lodgingRows}${vanRow}${catRows}
    <tr class="tot"><td>TOTAL BOOKED</td><td></td><td>${money(E.total)}</td><td>${money(E.pp)}</td></tr></tbody></table></div>
    <div class="meta">Mark a lodging listing or an item as <b>Booked</b> on its tab to add it here. Faded rows show what's still unbooked and are not in the total. Per person = group total ÷ ${n}; "One person only" items are in the group total but aren't everyone's share.</div></div>`;
}

function vanHTML(){
  const E = calcEstimate(), V = E.van, days = E.nights;
  const lineRows = V.lines.map(l => `<tr>
    <td><input data-col="budget_van" data-id="${esc(l.id)}" data-field="name" value="${esc(l.name)}" maxlength="60"></td>
    <td><input type="number" min="0" step="any" data-type="num" data-col="budget_van" data-id="${esc(l.id)}" data-field="rate" value="${esc(l.rate??"")}" style="width:80px"></td>
    <td><input type="number" min="0" step="any" data-type="num" data-col="budget_van" data-id="${esc(l.id)}" data-field="qty" value="${esc(l.qty??"")}" placeholder="${days}" style="width:70px"></td>
    <td><input data-col="budget_van" data-id="${esc(l.id)}" data-field="note" value="${esc(l.note||"")}" maxlength="40" style="width:100px"></td>
    <td>${money(l.amt)}</td><td><button class="btn ghost small" data-do="delete" data-col="budget_van" data-id="${esc(l.id)}">🗑️</button></td></tr>`).join("");
  return `<div class="card plain"><b>🚐 Passenger van rental</b> <span class="meta">${days} days (from nights on the Estimate tab)</span>
    <div class="row" style="align-items:center;margin:8px 0"><span>Status</span>${statusSel("vanStatus",bset.vanStatus,["Idea","Considering","Booked"])}<span class="meta">${E.vanCounted?"✔ counts toward the budget":"not counted until Booked"}</span></div>
    <div class="tbl"><table><thead><tr><th>Line</th><th>Rate</th><th>Qty (blank = every day)</th><th>Note</th><th>Amount</th><th></th></tr></thead><tbody>
    <tr><td>1 week</td><td>${setNum("vanWeek",90)}</td><td>${days>=7?1:0}</td><td></td><td>${money(V.week)}</td><td></td></tr>
    <tr><td>Per day</td><td>${setNum("vanDay",90)}</td><td>${V.extra}</td><td class="meta">${days>=7?"days beyond 7":"all days"}</td><td>${money(V.dayCost)}</td><td></td></tr>
    ${lineRows}
    <tr><td>Subtotal</td><td></td><td></td><td></td><td>${money(V.subtotal)}</td><td></td></tr>
    <tr><td>Taxes</td><td>${setNum("taxPct",90)} %</td><td></td><td></td><td>${money(V.tax)}</td><td></td></tr>
    <tr class="tot"><td>Total</td><td></td><td></td><td></td><td>${money(V.total)}</td><td></td></tr>
    <tr><td>Per person</td><td></td><td></td><td></td><td>${money(V.pp)}</td><td></td></tr></tbody></table></div>
    <div class="actions"><button class="btn small" data-do="addVan">+ Add line</button></div></div>`;
}

/* ---------- Lodging tab (the Airbnb comparison, now the single place for lodging) ---------- */
function renderLodging(body){
  lForm = false;
  body.innerHTML = `<div class="card plain"><b>🏡 Lodging options</b>
    <div class="meta">Edit anything, vote 👍, and set a listing to <b>Booked</b> to add it to the 💰 Budget. Costs are always split among the group.</div>
    <div class="actions"><button class="btn" data-do="addAir" data-reg="sj">+ Add listings</button></div></div><div id="lform"></div>${lodgingHTML()}`;
  body.onchange = onBudgetChange; body.onclick = onBudgetClick;
}
function lodgingHTML(){
  const n = Math.max(1,num(bset.people));
  return REGIONS.map(([reg,label,k]) => {
    const nights = num(bset["nights"+k]);
    const rows = bAir.filter(x => x.region===reg).map(x => {
      const booked = x.status==="Booked", votes = x.votes||[], voted = votes.includes(me);
      const f = (field,type,w,extra="") => `<input ${type==="num"?`type="number" min="0" step="any" data-type="num"`:""} data-col="budget_airbnb" data-id="${esc(x.id)}" data-field="${field}" value="${esc(x[field]??"")}" style="width:${w}px" ${extra}>`;
      const sl = (field,opts,cur) => `<select data-col="budget_airbnb" data-id="${esc(x.id)}" data-field="${field}">${opts.map(([v,t]) => `<option value="${v}" ${cur===v?"selected":""}>${t}</option>`).join("")}</select>`;
      const stay = perNight(x)*nights;
      return `<tr class="${booked?"sel":""}">
        <td style="white-space:nowrap">${f("name","text",210)} ${/^https?:\/\//i.test(x.link||"") ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">↗</a>` : ""}</td>
        <td>${sl("status",[["Idea","Idea"],["Considering","Considering"],["Booked","Booked"]],x.status||"Idea")}</td>
        <td>${f("minDays","num",60)}</td><td>${f("price","num",85)}</td>
        <td>${sl("priceType",[["night","per night"],["stay","total for min stay"]],x.priceType||"night")}</td>
        <td><b>${money(perNight(x))}</b></td><td>${money(stay)}</td><td>${money(stay/n)}</td>
        <td>${f("bedrooms","num",55)}</td><td>${f("beds","num",55)}</td><td>${f("baths","num",55)}</td>
        <td>${sl("beach",[["",""],["Y","Y"],["N","N"]],x.beach||"")}</td>
        <td>${f("parking","text",90)}</td><td>${f("rating","num",65)}</td>
        <td><button class="btn ghost small" data-do="vote" data-id="${esc(x.id)}">👍 ${votes.length||""}${voted?" ✓":""}</button></td>
        <td>${f("link","text",120,'placeholder="https://…"')}</td>
        <td><button class="btn ghost small" data-do="delete" data-col="budget_airbnb" data-id="${esc(x.id)}">🗑️</button></td></tr>`;
    }).join("");
    return `<div class="card c-lodging"><b>🏠 ${label}</b> <span class="meta">${nights} nights${bset["label"+k]?` · ${esc(bset["label"+k])}`:""} · "Stay" and "Per person" use these nights and ${n} people</span>
      <div class="tbl"><table><thead><tr><th>Listing</th><th>Status</th><th>Min nights</th><th>Price</th><th>Price is</th><th>Per night</th><th>Stay</th><th>Per person</th><th>Bedrooms</th><th>Beds</th><th>Baths</th><th>Beach</th><th>Parking</th><th>Rating</th><th>Votes</th><th>Link</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="17" class="empty">No listings yet.</td></tr>`}</tbody></table></div>
      <div class="actions"><button class="btn small" data-do="addAir" data-reg="${reg}">+ Add ${label} listing</button></div></div>`;
  }).join("");
}

async function onBudgetChange(e){
  const d = e.target.dataset; if(!d.set && !d.col) return;
  let v = e.target.value; if(d.type==="num") v = v==="" ? null : Number(v);
  try{
    if(d.set) await setDoc(doc(...tripRef("meta","budget")), { [d.set]:v, updatedBy:me, updatedAt:serverTimestamp() }, { merge:true });
    else await updateDoc(doc(...tripRef(d.col,d.id)), { [d.field]:v, updatedBy:me, updatedAt:serverTimestamp() });
  }catch(err){ showErr(err); }
}
async function onBudgetClick(e){
  const b = e.target.closest("[data-do]"); if(!b) return; const d = b.dataset;
  try{
    if(d.do==="goto"){ bTab = d.to; ls.set("pr_btab",bTab); return renderBody(); }
    if(d.do==="gotoTab") return document.querySelector(`#nav [data-t="${d.to}"]`).click();
    if(d.do==="vote"){ const x = bAir.find(z => z.id===d.id); if(x) await updateDoc(doc(...tripRef("budget_airbnb",d.id)), { votes:(x.votes||[]).includes(me) ? arrayRemove(me) : arrayUnion(me) }); }
    if(d.do==="delete" && confirm("Delete this row?")) await deleteDoc(doc(...tripRef(d.col,d.id)));
    if(d.do==="addVan") await addDoc(collection(...tripRef("budget_van")), { name:"New line", rate:0, qty:null, note:"", order:Date.now() });
    if(d.do==="addAir") openLodgingForm(d.reg||"sj");
  }catch(err){ showErr(err); }
}
